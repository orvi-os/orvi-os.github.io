<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Hard Genius Test 60</title>

<style>
body { font-family: Arial; margin:0; background:#f1f1f1; }
.container { max-width:520px; margin:auto; padding:12px; }

.timer {
    position:sticky; top:0;
    background:#d32f2f; color:white;
    padding:10px;
    text-align:center;
    font-weight:bold;
    border-radius:8px;
}

.card {
    background:white;
    padding:12px;
    margin-bottom:12px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

button {
    width:100%;
    padding:14px;
    font-size:16px;
    border:none;
    border-radius:10px;
    background:#2e7d32;
    color:white;
}

.result {
    text-align:center;
    font-size:22px;
    font-weight:bold;
}
</style>
</head>

<body>
<div class="container">

<div class="timer" id="timer">30:00</div>
<h2 style="text-align:center;">🧠 ULTRA HARD GENIUS TEST (60)</h2>

<div id="quiz"></div>

<button onclick="submitTest()">UKONČIT TEST 🏆</button>
<div class="card result" id="result"></div>

</div>

<script>
const questions = [
["1. Co je logicky nemožné?","A čas běží","B kruh má rohy","C voda je mokrá","D pes štěká"],
["2. 12×12 = ?","A 144","B 121","C 132","D 140"],
["3. Co je živé?","A kámen","B strom","C kov","D plast"],
["4. 100 - 37 = ?","A 63","B 67","C 73","D 62"],
["5. Co je abstraktní?","A číslo","B auto","C pes","D strom"],

["6. 9² = ?","A 81","B 72","C 90","D 99"],
["7. Co roste?","A čas","B kámen","C plast","D kov"],
["8. Kolik stran má čtverec?","A 3","B 4","C 5","D 6"],
["9. Co je rychlejší?","A světlo","B auto","C kolo","D člověk"],
["10. 15×3 = ?","A 45","B 40","C 50","D 35"],

["11. Co je paradox?","A věta sama sebe popírá","B pes","C strom","D auto"],
["12. 144 ÷ 12 = ?","A 12","B 10","C 14","D 11"],
["13. Co je logika?","A myšlení","B běh","C spánek","D jídlo"],
["14. Kolik je 7×8?","A 56","B 54","C 58","D 60"],
["15. Co je nekonečno?","A bez konce","B konec","C bod","D čára"],

["16. 2⁵ = ?","A 32","B 16","C 64","D 20"],
["17. Co je algoritmus?","A postup","B strom","C auto","D pes"],
["18. 99 - 33 = ?","A 66","B 63","C 69","D 60"],
["19. Co je číslo?","A abstrakce","B pes","C voda","D kámen"],
["20. 6×7 = ?","A 42","B 36","C 48","D 40"],

["21. Co je komplexní?","A problém","B míč","C auto","D pes"],
["22. 11×11 = ?","A 121","B 111","C 131","D 101"],
["23. Co je pravděpodobnost?","A šance","B jistota","C čas","D prostor"],
["24. 8×9 = ?","A 72","B 81","C 64","D 70"],
["25. Co je vědomí?","A uvědomování","B kámen","C auto","D voda"],

["26. 50 ÷ 2 = ?","A 25","B 20","C 30","D 15"],
["27. Co je data?","A informace","B pes","C strom","D auto"],
["28. 13×3 = ?","A 39","B 36","C 42","D 33"],
["29. Co je funkce?","A vztah","B objekt","C strom","D auto"],
["30. 100 ÷ 4 = ?","A 25","B 20","C 30","D 15"],

["31. Co je neuron?","A buňka","B kámen","C auto","D voda"],
["32. 14×4 = ?","A 56","B 52","C 60","D 54"],
["33. Co je model?","A simulace","B strom","C pes","D voda"],
["34. 81 ÷ 9 = ?","A 9","B 8","C 7","D 6"],
["35. Co je logická chyba?","A error","B strom","C auto","D voda"],

["36. 7² = ?","A 49","B 42","C 56","D 36"],
["37. Co je inference?","A závěr","B začátek","C strom","D auto"],
["38. 10³ = ?","A 1000","B 100","C 10","D 500"],
["39. Co je struktura?","A uspořádání","B chaos","C voda","D pes"],
["40. 5×5×5 = ?","A 125","B 100","C 150","D 75"],

["41. Co je optimalizace?","A zlepšení","B zhoršení","C chaos","D voda"],
["42. 64 ÷ 8 = ?","A 8","B 6","C 7","D 9"],
["43. Co je systém?","A celek","B část","C voda","D kámen"],
["44. 3×3×3 = ?","A 27","B 18","C 24","D 21"],
["45. Co je transformace?","A změna","B stálost","C kámen","D voda"],

["46. 18×2 = ?","A 36","B 32","C 40","D 30"],
["47. Co je problém?","A úkol","B kámen","C auto","D voda"],
["48. 12×5 = ?","A 60","B 50","C 55","D 65"],
["49. Co je řešení?","A odpověď","B otázka","C chaos","D voda"],
["50. 9×9 = ?","A 81","B 72","C 90","D 99"],

["51. Co je inteligence?","A schopnost myslet","B kámen","C voda","D auto"],
["52. 15×4 = ?","A 60","B 50","C 55","D 65"],
["53. Co je analýza?","A rozbor","B chaos","C pes","D auto"],
["54. 1000 ÷ 10 = ?","A 100","B 10","C 50","D 200"],
["55. Co je logický systém?","A pravidla","B chaos","C voda","D pes"],

["56. 25×2 = ?","A 50","B 40","C 60","D 45"],
["57. Co je AI?","A umělá inteligence","B kámen","C voda","D auto"],
["58. 7×6 = ?","A 42","B 36","C 48","D 40"],
["59. Co je problém solving?","A řešení problémů","B chaos","C voda","D pes"],
["60. 11×9 = ?","A 99","B 90","C 100","D 88"]
];

let correct = Array(60).fill("A");

let quiz = document.getElementById("quiz");

questions.forEach((q, i) => {
    quiz.innerHTML += `
    <div class="card">
        <p><b>${q[0]}</b></p>
        <label><input type="radio" name="q${i}" value="A"> A) ${q[1].split("A ")[1] || q[1]}</label><br>
        <label><input type="radio" name="q${i}" value="B"> B) ${q[2]}</label><br>
        <label><input type="radio" name="q${i}" value="C"> C) ${q[3]}</label><br>
        <label><input type="radio" name="q${i}" value="D"> D) ${q[4]}</label>
    </div>
    `;
});

let time = 30*60;
let timer = setInterval(()=>{
    let m = Math.floor(time/60);
    let s = time%60;
    document.getElementById("timer").innerText = `${m}:${s<10?"0"+s:s}`;
    time--;
    if(time<0) submitTest();
},1000);

function submitTest(){
    let score = 0;

    for(let i=0;i<60;i++){
        let q = document.querySelector(`input[name="q${i}"]:checked`);
        if(q && q.value === correct[i]) score++;
    }

    let rank = "";

    if(score < 20) rank = "Explorer 🌱";
    else if(score < 35) rank = "Smart Thinker 🌟";
    else if(score < 50) rank = "Genius 🧠🔥";
    else rank = "ULTRA GENIUS 🏆🚀";

    document.getElementById("quiz").innerHTML = "";
    document.querySelector("button").style.display = "none";
    document.getElementById("result").innerHTML =
        `Skóre: ${score}/60<br>${rank}`;

    clearInterval(timer);
}
</script>

</body>
</html>
