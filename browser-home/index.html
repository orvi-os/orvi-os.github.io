<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Tab</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.65)),
url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2000&q=80");

background-size:cover;
background-position:center;

color:white;
}

.container{
width:980px;
max-width:95vw;

padding:40px;

border-radius:34px;

background:rgba(18,22,30,.40);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.10);

text-align:center;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:30px;
}

.logo{
font-size:40px;
font-weight:800;
}

select{
padding:12px 16px;

border:none;
border-radius:14px;

background:rgba(255,255,255,.12);

color:white;
}

select option{ color:black; }

.search{
display:flex;
gap:12px;

margin-bottom:40px;
}

.search input{
flex:1;

padding:18px;

border:none;
outline:none;

border-radius:18px;

background:rgba(255,255,255,.10);

color:white;
font-size:18px;
}

.search button{
padding:18px 26px;

border:none;
border-radius:18px;

background:#4f86ff;

color:white;

font-weight:700;

cursor:pointer;
}

.shortcuts{
display:flex;
flex-wrap:wrap;
justify-content:center;

gap:14px;
}

.card{
width:170px;

padding:18px;

border-radius:20px;

background:rgba(255,255,255,.08);

cursor:pointer;

position:relative;
}

.card:hover{
transform:translateY(-5px);
background:rgba(255,255,255,.16);
}

.editBtn{
position:absolute;
top:8px;
right:8px;

font-size:11px;

padding:4px 8px;

border:none;
border-radius:10px;

background:rgba(255,255,255,.15);

color:white;
cursor:pointer;
}

.add{
background:rgba(79,134,255,.25);
}

</style>
</head>

<body>

<div class="container">

<div class="topbar">

<div class="logo">ORVI</div>

<select id="engine">
<option value="https://www.startpage.com/search?q=">Startpage</option>
<option value="https://www.google.com/search?q=">Google</option>
<option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
<option value="https://www.bing.com/search?q=">Bing</option>
<option value="https://search.brave.com/search?q=">Brave</option>
<option value="https://www.ecosia.org/search?q=">Ecosia</option>
<option value="https://www.qwant.com/?q=">Qwant</option>
<option value="https://www.youtube.com/results?search_query=">YouTube</option>
<option value="https://github.com/search?q=">GitHub</option>
<option value="https://en.wikipedia.org/w/index.php?search=">Wikipedia</option>
</select>

</div>

<div class="search">

<input id="query" type="text" placeholder="Search...">

<button onclick="searchWeb()">Search</button>

</div>

<div class="shortcuts" id="shortcuts">

<div class="card add" onclick="addShortcut()">
+ Add
</div>

</div>

</div>

<script>

const q = document.getElementById("query");
const engine = document.getElementById("engine");
const box = document.getElementById("shortcuts");

let shortcuts = JSON.parse(localStorage.getItem("orvi_shortcuts") || "[]");

/* LOAD ENGINE */
engine.value = localStorage.getItem("orvi_engine") || engine.value;

/* SAVE ENGINE */
engine.addEventListener("change", ()=>{
localStorage.setItem("orvi_engine", engine.value);
});

/* SEARCH */
function searchWeb(){
if(!q.value) return;

window.open(
engine.value + encodeURIComponent(q.value),
"_blank",
"noopener"
);
}

/* OPEN */
function openShortcut(url){
window.open(url,"_blank","noopener");
}

/* SAVE SHORTCUTS */
function saveShortcuts(){
localStorage.setItem("orvi_shortcuts", JSON.stringify(shortcuts));
}

/* RENDER */
function render(){

box.innerHTML = "";

shortcuts.forEach((s,i)=>{

let card = document.createElement("div");
card.className = "card";

card.innerHTML = `
${s.name}
<button class="editBtn">Edit</button>
`;

card.onclick = ()=> openShortcut(s.url);

/* EDIT */
card.querySelector("button").onclick = (e)=>{
e.stopPropagation();

let name = prompt("New name:", s.name);
if(!name) return;

let url = prompt("New URL:", s.url);
if(!url) return;

shortcuts[i] = {name,url};

saveShortcuts();
render();
};

box.appendChild(card);
});

/* ADD BUTTON */
let add = document.createElement("div");
add.className = "card add";
add.textContent = "+ Add";
add.onclick = addShortcut;

box.appendChild(add);
}

/* ADD */
function addShortcut(){

let name = prompt("Shortcut name:");
if(!name) return;

let url = prompt("URL:");
if(!url) return;

shortcuts.push({name,url});

saveShortcuts();
render();
}

/* INIT */
render();

/* ENTER */
q.addEventListener("keydown", e=>{
if(e.key==="Enter"){
searchWeb();
}
});

</script>

</body>
</html>
